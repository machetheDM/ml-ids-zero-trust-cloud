name: ML Pipeline

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "data/**"
      - "requirements.txt"
      - ".github/workflows/ml-pipeline.yml"
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  preprocess:
    name: Preprocess Data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run preprocessing pipeline
        run: python src/preprocess.py
      - name: Upload processed data
        uses: actions/upload-artifact@v4
        with:
          name: processed-data
          path: data/*.npy
          retention-days: 7

  train:
    name: Train Models (MLflow)
    needs: preprocess
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/
      - name: Train all models with MLflow tracking
        run: python src/train_mlflow.py
      - name: Upload trained models
        uses: actions/upload-artifact@v4
        with:
          name: trained-models
          path: results/models/
          retention-days: 7
      - name: Upload MLflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mlflow-runs
          path: mlruns/
          retention-days: 7

  evaluate:
    name: Evaluate & Validate
    needs: train
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/
      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: results/models/
      - name: Validate against paper benchmarks
        run: |
          python -c "
          import numpy as np, json
          from src.models import RandomForestIDS, LSTMIDS, XGBoostIDS
          from src.evaluate import compute_all_metrics

          X_test = np.load('data/X_test.npy')
          y_test = np.load('data/y_test.npy')

          # Paper benchmarks (Table 5, ±2pp tolerance)
          benchmarks = {
              'random_forest': {'accuracy': 0.968, 'f1': 0.966},
              'lstm':          {'accuracy': 0.981, 'f1': 0.981},
              'xgboost':       {'accuracy': 0.973, 'f1': 0.973},
          }

          results = {}
          for name, bench in benchmarks.items():
              try:
                  if name == 'lstm':
                      model = LSTMIDS.load(name=name, n_classes=2)
                      TIMESTEPS = 20
                      n_seq = (len(y_test) // TIMESTEPS) * TIMESTEPS
                      y_pred = model.predict(X_test)
                      y_true = y_test[:n_seq:TIMESTEPS]
                  else:
                      cls = {'random_forest': RandomForestIDS, 'xgboost': XGBoostIDS}[name]
                      model = cls.load(name=name)
                      y_pred = model.predict(X_test)
                      y_true = y_test
                  m = compute_all_metrics(y_true, y_pred, None)
                  acc_ok = abs(m['accuracy'] - bench['accuracy']) <= 0.02
                  f1_ok = abs(m['f1'] - bench['f1']) <= 0.02
                  results[name] = {
                      'accuracy': m['accuracy'], 'f1': m['f1'],
                      'accuracy_pass': acc_ok, 'f1_pass': f1_ok,
                  }
                  status = 'PASS' if (acc_ok and f1_ok) else 'FAIL'
                  print(f'{name}: {status} | Acc={m[\"accuracy\"]:.4f} (bench={bench[\"accuracy\"]}) | F1={m[\"f1\"]:.4f} (bench={bench[\"f1\"]})')
              except Exception as e:
                  print(f'{name}: SKIP — {e}')
                  results[name] = {'error': str(e)}

          with open('results/benchmark_validation.json', 'w') as f:
              json.dump(results, f, indent=2)

          # Fail if any model fails validation
          for name, r in results.items():
              if 'accuracy_pass' in r and not r['accuracy_pass']:
                  raise SystemExit(f'{name} accuracy outside ±2pp tolerance')
              if 'f1_pass' in r and not r['f1_pass']:
                  raise SystemExit(f'{name} F1 outside ±2pp tolerance')
          print('All benchmarks validated.')
          "

  drift:
    name: Drift Monitoring
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Download processed data
        uses: actions/download-artifact@v4
        with:
          name: processed-data
          path: data/
      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: results/models/
      - name: Run drift monitor (5 windows)
        run: python src/drift_monitor.py --schedule
      - name: Upload drift reports
        uses: actions/upload-artifact@v4
        with:
          name: drift-reports
          path: results/drift_reports/
          retention-days: 30

  build-api:
    name: Build Inference API Image
    needs: evaluate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download trained models
        uses: actions/download-artifact@v4
        with:
          name: trained-models
          path: results/models/
      - name: Build Docker image
        run: docker build -t ml-ids-inference:latest -f api/Dockerfile .
      - name: Test health endpoint
        run: |
          docker run -d --name ml-ids-test -p 8000:8000 ml-ids-inference:latest
          sleep 10
          curl -f http://localhost:8000/health || docker logs ml-ids-test
          docker stop ml-ids-test
